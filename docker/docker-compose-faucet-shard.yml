services:
  faucet:
    image: "${LINERA_IMAGE:-linera}"
    container_name: faucet
    ports:
      - "31080:31080"
    command: [ "./faucet-shard-entrypoint.sh" ]
    volumes:
      - ../output/wallet/faucet:/wallet
      - ../output/wallet/faucet-depositor:/depositor
    environment:
      RUST_LOG: warn
      NO_PROXY: localhost,127.0.0.1,api.testnet-conway.ams.respeer.ai,api.testnet-conway.faucet.respeer.ai,api.testnet-conway.blobgateway.com,api.testnet-conway.rpc.respeer.ai,api.testnet-conway.lineraswap.fun,api.testnet-conway.linerameme.fun,api.testnet-conway.kline.lineraswap.fun,testnet-conway.linerameme.fun,testnet-conway.lineraswap.fun,graphiql.blobgateway.com,graphiql.ams.respeer.ai,graphiql.linerameme.fun,graphiql.lineraswap.fun
      no_proxy: localhost,127.0.0.1,api.testnet-conway.ams.respeer.ai,api.testnet-conway.faucet.respeer.ai,api.testnet-conway.blobgateway.com,api.testnet-conway.rpc.respeer.ai,api.testnet-conway.lineraswap.fun,api.testnet-conway.linerameme.fun,api.testnet-conway.kline.lineraswap.fun,testnet-conway.linerameme.fun,testnet-conway.lineraswap.fun,graphiql.blobgateway.com,graphiql.ams.respeer.ai,graphiql.linerameme.fun,graphiql.lineraswap.fun
    restart: always
